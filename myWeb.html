<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Navigation & Location Search</title>

    <!-- Leaflet and Routing Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            z-index: 1002;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            border: 2px solid #ffcc00;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.5s ease-in-out;
        }
        .search-container.show {
            transform: translateX(-50%) translateY(80px);
        }
        #searchBar {
            width: 80%;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: #f1f1f1;
            color: #333;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .icon-controls {
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .icon-btn:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }
        .icon-btn i {
            width: 24px;
            height: 24px;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Search and Filter Controls -->
    <div class="search-container" id="searchContainer">
        <input type="text" id="searchBar" placeholder="Search for a location..." onkeypress="if(event.key === 'Enter') navigateToSearchLocation()">
        <div class="icon-controls">
            <div class="icon-btn" onclick="setStartLocation()" title="Set Start Location">
                <i data-lucide="circle"></i>
            </div>
            <div class="icon-btn" onclick="setEndLocation()" title="Set Destination">
                <i data-lucide="flag"></i>
            </div>
            <div class="icon-btn" onclick="filterAssets()" title="All Locations">
                <i data-lucide="map-pin"></i>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- JavaScript Libraries -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <script>
        lucide.createIcons();

        // Initialize the map centered on Bradford
        var map = L.map('map').setView([53.795, -1.759], 13);
        var baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var markersLayer = L.layerGroup().addTo(map);
        var routeControl;
        var startLocation = null;
        var endLocation = null;

        // Show search container when "Set Start Location" or "Set Destination" is clicked
        function showSearchContainer() {
            const searchContainer = document.getElementById('searchContainer');
            searchContainer.classList.add('show');
        }

        // Set Start Location functionality
        function setStartLocation() {
            showSearchContainer();
            startLocation = null;
            endLocation = null;
        }

        // Set End Location functionality
        function setEndLocation() {
            showSearchContainer();
            startLocation = null;
            endLocation = null;
        }

        // Fetch and display assets based on type (e.g., school, restaurant)
        function fetchAndDisplayAssets(type) {
            markersLayer.clearLayers();
            var bounds = map.getBounds();
            var query = `https://nominatim.openstreetmap.org/search?format=json&bounded=1&viewbox=${bounds.getWest()},${bounds.getSouth()},${bounds.ge

            fetch(query)
                .then(response => response.json())
                .then(data => {
                    data.forEach(asset => {
                        var marker = L.marker([asset.lat, asset.lon])
                            .addTo(markersLayer)
                            .bindPopup(`<strong>${asset.display_name}</strong><br>Type: ${type}`);
                    });
                })
                .catch(error => console.log('Error fetching assets:', error));
        }

        // Navigate to a searched location from current location
        function navigateToSearchLocation() {
            var destination = document.getElementById('searchBar').value;
            if (!destination) {
                alert("Please enter a location to navigate to.");
                return;
            }
            navigator.geolocation.getCurrentPosition(function(position) {
                var currentLat = position.coords.latitude;
                var currentLng = position.coords.longitude;
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${destination}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.length === 0) {
                            alert("Destination not found.");
                            return;
                        }
                        var destLatLng = [data[0].lat, data[0].lon];
                        if (routeControl) {
                            map.removeControl(routeControl);
                        }
                        routeControl = L.Routing.control({
                            waypoints: [
                                L.latLng(currentLat, currentLng),
                                L.latLng(destLatLng[0], destLatLng[1])
                            ],
                            routeWhileDragging: true,
                            createMarker: function(i, waypoint) {
                                return L.marker(waypoint.latLng).bindPopup(i === 0 ? "Start" : "Destination").openPopup();
                            }
                        }).addTo(map);
                    })
                    .catch(error => console.log('Error fetching destination location:', error));
            }, function(error) {
                alert("Location access denied or unavailable.");
            });
        }

        // Clear all markers and cancel any active navigation route
        function filterAssets() {
            markersLayer.clearLayers();

            if (routeControl) {
                map.removeControl(routeControl);
                routeControl = null;
            }
        }

        // Handle map click event to set start or end locations
        map.on('click', function(e) {
            if (!startLocation) {
                startLocation = e.latlng;
                L.marker(startLocation).addTo(map).bindPopup("Start Location").openPopup();
            } else if (!endLocation) {
                endLocation = e.latlng;
                L.marker(endLocation).addTo(map).bindPopup("Destination").openPopup();

                if (startLocation && endLocation) {
                    if (routeControl) {
                        map.removeControl(routeControl);
                    }
                    routeControl = L.Routing.control({
                        waypoints: [L.latLng(startLocation), L.latLng(endLocation)],
                        routeWhileDragging: true
                    }).addTo(map);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map with Navigation and Custom Assets</title>

    <!-- Leaflet & Routing Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }
        .custom-asset-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1003;
            padding: 10px;
            border-radius: 10px;
            background: white;
            color: #333;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        .custom-asset-container input, .custom-asset-container button {
            margin-bottom: 5px;
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .custom-asset-container button {
            background-color: #1e3c72;
            color: white;
            cursor: pointer;
        }
        .custom-asset-container button:hover {
            background-color: #16325c;
        }
    </style>
</head>
<body>
    <!-- Custom Asset Control -->
    <div class="custom-asset-container">
        <input type="text" id="customAssetName" placeholder="Enter asset name">
        <button onclick="enableCustomAssetMode()">Add Custom Asset</button>
    </div>

    <!-- Search & Filter Controls -->
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search for a location..." onkeypress="if(event.key === 'Enter') navigateT
        <div class="icon-controls">
            <div class="icon-btn" onclick="fetchAndDisplayAssets('school')" title="Schools">
                <i data-lucide="school"></i>
            </div>
            <div class="icon-btn" onclick="fetchAndDisplayAssets('restaurant')" title="Restaurants">
                <i data-lucide="utensils"></i>
            </div>
            <div class="icon-btn" onclick="fetchAndDisplayAssets('park')" title="Parks">
                <i data-lucide="tree-pine"></i>
            </div>
            <div class="icon-btn" onclick="fetchAndDisplayAssets('hospital')" title="Hospitals">
                <i data-lucide="hospital"></i>
            </div>
            <div class="icon-btn" onclick="clearAllMarkersAndNavigation()" title="Clear All">
                <i data-lucide="map-pin"></i>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet Libraries -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <script>
        lucide.createIcons();

        let map = L.map('map').setView([53.795, -1.759], 13);
        let baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let customMarkers = L.layerGroup().addTo(map);
        let routeControl;
        let customAssetMode = false;

        function enableCustomAssetMode() {
            customAssetMode = true;
            alert("Click on the map to place your custom asset.");
        }

        // Add marker on map click
        map.on('click', function (e) {
            if (customAssetMode) {
                let assetName = document.getElementById('customAssetName').value || "Custom Asset";
                let marker = L.marker(e.latlng).addTo(customMarkers).bindPopup(assetName).openPopup();
                customAssetMode = false;
            } else {
                let marker = L.marker(e.latlng).addTo(customMarkers).bindPopup("Custom Marker").openPopup();
                marker.on('dblclick', function () {
                    customMarkers.removeLayer(marker);
                });
            }
        });

        // Existing feature functions remain unchanged (search, navigation, asset fetch, etc.)
    </script>
</body>
</html>
